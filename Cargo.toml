[package]
name = "wayhaven"
version = "0.1.0"
edition = "2021"
description = "Lightweight GPU-accelerated video wallpaper daemon for Wayland, integrated with the end-4 (illogical-impulse) Quickshell config"
repository = "https://github.com/qvap/wayhaven"
license = "MIT"

[dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["static"] }
glow = "0.17"
serde_json = "1"
libc = "0.2"
log = { version = "0.4", features = ["std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
